<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#081c2c" />
  <meta name="description" content="Dipika Wellness Circle offers personalised yoga, home visits and therapeutic movement for pain relief in Gurugram." />

  <title>Dipika Wellness Circle | Yoga & Therapeutic Movement</title>

  <!-- Upload these files inside your GitHub repository:
       assets/hero.jpg
       assets/about.jpg
  -->

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --navy: #071b2d;
      --navy-2: #0b2940;
      --ink: #102331;
      --muted: #60717d;
      --cream: #f8fbf7;
      --white: #ffffff;
      --mint: #dff7e9;
      --mint-strong: #9ee5bc;
      --green: #1e9a68;
      --green-dark: #0d704a;
      --orange: #ff8c5f;
      --yellow: #ffc857;
      --blue: #4db5e9;
      --lavender: #e6e2ff;
      --line: rgba(16, 35, 49, 0.11);
      --shadow: 0 22px 70px rgba(8, 29, 45, 0.13);
      --shadow-soft: 0 12px 35px rgba(8, 29, 45, 0.08);
      --radius-xl: 34px;
      --radius-lg: 24px;
      --radius-md: 16px;
      --container: 1180px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--cream);
      color: var(--ink);
      font-family: "DM Sans", sans-serif;
      overflow-x: hidden;
    }

    body.menu-open {
      overflow: hidden;
    }

    ::selection {
      background: var(--mint-strong);
      color: var(--navy);
    }

    img {
      display: block;
      max-width: 100%;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      width: min(var(--container), calc(100% - 44px));
      margin: 0 auto;
    }

    .skip-link {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 1000;
      padding: 12px 18px;
      border-radius: 999px;
      background: var(--white);
      color: var(--navy);
      transform: translateY(-150%);
      transition: transform 0.25s ease;
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .scroll-progress {
      position: fixed;
      inset: 0 auto auto 0;
      z-index: 1001;
      height: 4px;
      width: 0;
      background: linear-gradient(90deg, var(--green), var(--blue), var(--orange));
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--green-dark);
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 27px;
      height: 2px;
      border-radius: 10px;
      background: var(--green);
    }

    .eyebrow.light {
      color: var(--mint-strong);
    }

    .eyebrow.light::before {
      background: var(--mint-strong);
    }

    h1,
    h2,
    h3,
    h4 {
      font-family: "Plus Jakarta Sans", sans-serif;
      letter-spacing: -0.045em;
    }

    h1 em,
    h2 em {
      color: var(--green);
      font-style: normal;
    }

    .section {
      position: relative;
      padding: 120px 0;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      min-height: 55px;
      padding: 0 23px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: var(--green);
      box-shadow: 0 12px 26px rgba(30, 154, 104, 0.24);
      color: var(--white);
      font-size: 0.93rem;
      font-weight: 700;
      transition: 0.3s ease;
    }

    .button:hover {
      background: var(--green-dark);
      box-shadow: 0 16px 32px rgba(30, 154, 104, 0.3);
      transform: translateY(-3px);
    }

    .button svg {
      width: 18px;
      height: 18px;
    }

    .button.dark {
      background: var(--navy);
      box-shadow: 0 12px 26px rgba(7, 27, 45, 0.2);
    }

    .button.dark:hover {
      background: var(--navy-2);
    }

    .button.outline {
      border-color: rgba(255, 255, 255, 0.3);
      background: transparent;
      box-shadow: none;
    }

    .button.outline:hover {
      border-color: var(--mint-strong);
      background: rgba(255, 255, 255, 0.08);
    }

    .text-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--green-dark);
      font-weight: 700;
    }

    .text-link span {
      transition: transform 0.25s ease;
    }

    .text-link:hover span {
      transform: translate(4px, -4px);
    }

    /* Navigation */
    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 100;
      width: 100%;
      padding: 18px 0;
      transition: 0.3s ease;
    }

    .site-header.scrolled {
      padding: 10px 0;
      background: rgba(248, 251, 247, 0.86);
      border-bottom: 1px solid rgba(16, 35, 49, 0.08);
      backdrop-filter: blur(22px);
      box-shadow: 0 6px 24px rgba(8, 29, 45, 0.05);
    }

    .nav-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      flex-shrink: 0;
    }

    .brand-mark {
      display: grid;
      width: 43px;
      height: 43px;
      place-items: center;
      border-radius: 15px;
      background:
        radial-gradient(circle at 30% 24%, #ffffff 0 6%, transparent 7%),
        linear-gradient(140deg, var(--green), var(--navy));
      box-shadow: 0 10px 23px rgba(13, 112, 74, 0.25);
      color: var(--white);
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: 1.3rem;
      font-weight: 800;
    }

    .brand strong {
      display: block;
      color: var(--navy);
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: 1rem;
      letter-spacing: -0.04em;
    }

    .brand small {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .site-nav {
      display: flex;
      align-items: center;
      gap: 27px;
    }

    .site-nav > a:not(.button) {
      position: relative;
      color: #40515c;
      font-size: 0.88rem;
      font-weight: 600;
    }

    .site-nav > a:not(.button)::after {
      position: absolute;
      right: 0;
      bottom: -8px;
      left: 0;
      height: 2px;
      border-radius: 4px;
      background: var(--green);
      content: "";
      transform: scaleX(0);
      transform-origin: right;
      transition: transform 0.25s ease;
    }

    .site-nav > a:not(.button):hover::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    .nav-button {
      min-height: 43px;
      padding: 0 17px;
      font-size: 0.8rem;
    }

    .menu-toggle {
      display: none;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      background: var(--navy);
      color: white;
    }

    .menu-toggle span {
      display: block;
      width: 18px;
      height: 2px;
      margin: 4px auto;
      border-radius: 4px;
      background: white;
      transition: 0.25s ease;
    }

    /* Hero */
    .hero {
      min-height: 790px;
      padding-top: 180px;
      overflow: hidden;
      background:
        radial-gradient(circle at 82% 13%, rgba(181, 235, 207, 0.85), transparent 24%),
        radial-gradient(circle at 9% 80%, rgba(230, 226, 255, 0.7), transparent 21%),
        var(--cream);
    }

    .hero::before,
    .hero::after {
      position: absolute;
      z-index: 0;
      width: 280px;
      height: 280px;
      border: 1px solid rgba(30, 154, 104, 0.12);
      border-radius: 50%;
      content: "";
      animation: float 8s ease-in-out infinite;
    }

    .hero::before {
      top: 112px;
      right: -90px;
    }

    .hero::after {
      right: 10px;
      bottom: -150px;
      width: 420px;
      height: 420px;
      animation-delay: -3s;
    }

    .hero-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 0.92fr 1.08fr;
      align-items: center;
      gap: 70px;
    }

    .hero-copy {
      animation: slide-up 0.9s both;
    }

    .hero-copy h1 {
      max-width: 650px;
      margin: 23px 0 22px;
      color: var(--navy);
      font-size: clamp(3.2rem, 6vw, 5.7rem);
      line-height: 0.99;
    }

    .hero-copy h1 span {
      display: inline-block;
    }

    .hero-description {
      max-width: 560px;
      color: var(--muted);
      font-size: 1.08rem;
      line-height: 1.8;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 22px;
      margin-top: 33px;
    }

    .phone-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--navy);
      font-size: 0.9rem;
      font-weight: 700;
    }

    .phone-link svg {
      width: 17px;
      color: var(--green);
    }

    .hero-trust {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-top: 47px;
    }

    .trust-avatars {
      display: flex;
      padding-left: 10px;
    }

    .trust-avatars span {
      display: grid;
      width: 34px;
      height: 34px;
      margin-left: -10px;
      place-items: center;
      border: 3px solid var(--cream);
      border-radius: 50%;
      background: var(--lavender);
      color: var(--navy);
      font-size: 0.68rem;
      font-weight: 800;
    }

    .trust-avatars span:nth-child(2) {
      background: var(--mint-strong);
    }

    .trust-avatars span:nth-child(3) {
      background: var(--orange);
    }

    .trust-copy {
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.5;
    }

    .trust-copy strong {
      color: var(--navy);
    }

    .stars {
      color: #efa92d;
      letter-spacing: 2px;
    }

    .hero-visual {
      position: relative;
      min-height: 500px;
      animation: slide-up 1s 0.16s both;
    }

    .hero-image-wrap {
      position: absolute;
      top: 0;
      right: 35px;
      width: min(100%, 480px);
      height: 520px;
      overflow: hidden;
      border: 10px solid rgba(255, 255, 255, 0.75);
      border-radius: 42% 42% 22px 22px;
      background:
        linear-gradient(145deg, rgba(30, 154, 104, 0.25), rgba(7, 27, 45, 0.1)),
        var(--mint);
      box-shadow: var(--shadow);
      transform: rotate(2deg);
      transition: transform 0.5s ease;
    }

    .hero-image-wrap:hover {
      transform: rotate(0deg) scale(1.015);
    }

    .hero-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: saturate(0.92);
    }

    .image-fallback {
      display: none;
      width: 100%;
      height: 100%;
      padding: 30px;
      background:
        radial-gradient(circle at 70% 20%, rgba(255, 255, 255, 0.7), transparent 14%),
        linear-gradient(140deg, #b7ecd0, #5389a0 62%, #102d43);
    }

    .hero-image-wrap.image-missing img,
    .about-image.image-missing img {
      display: none;
    }

    .hero-image-wrap.image-missing .image-fallback,
    .about-image.image-missing .image-fallback {
      display: block;
    }

    .hero-badge {
      position: absolute;
      top: 54px;
      left: -24px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 17px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.85);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(15px);
      animation: float 5s ease-in-out infinite;
    }

    .badge-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 7px rgba(30, 154, 104, 0.12);
    }

    .hero-badge strong {
      display: block;
      color: var(--navy);
      font-size: 0.8rem;
    }

    .hero-badge small {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.67rem;
    }

    .hero-location {
      position: absolute;
      right: 0;
      bottom: 23px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 13px 17px;
      border-radius: 999px;
      background: var(--navy);
      box-shadow: var(--shadow-soft);
      color: white;
      font-size: 0.76rem;
      font-weight: 600;
      animation: float 6s -2s ease-in-out infinite;
    }

    .hero-location svg {
      width: 15px;
      color: var(--mint-strong);
    }

    .hero-orb {
      position: absolute;
      right: -24px;
      bottom: 55px;
      width: 105px;
      height: 105px;
      border: 1px solid rgba(30, 154, 104, 0.2);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      animation: spin 20s linear infinite;
    }

    .hero-orb::after {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--orange);
      content: "";
    }

    /* Intro */
    .section-white {
      background: var(--white);
    }

    .intro-grid {
      display: grid;
      grid-template-columns: 0.88fr 1.12fr;
      align-items: center;
      gap: 90px;
    }

    .about-image {
      position: relative;
      min-height: 520px;
      overflow: hidden;
      border-radius: 32px;
      background:
        linear-gradient(145deg, rgba(30, 154, 104, 0.25), rgba(7, 27, 45, 0.1)),
        var(--mint);
      box-shadow: var(--shadow);
      transform: rotate(-2deg);
      transition: transform 0.5s ease;
    }

    .about-image:hover {
      transform: rotate(0deg) scale(1.01);
    }

    .about-image img {
      width: 100%;
      height: 100%;
      min-height: 520px;
      object-fit: cover;
    }

    .about-image .image-fallback {
      min-height: 520px;
      background:
        radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.8), transparent 16%),
        linear-gradient(140deg, #d7f6e2, #8bba9b 53%, #254b5b);
    }

    .about-floating-card {
      position: absolute;
      right: -22px;
      bottom: 30px;
      max-width: 200px;
      padding: 19px;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(15px);
    }

    .about-floating-card b {
      display: block;
      margin-bottom: 5px;
      color: var(--green-dark);
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: 1.65rem;
    }

    .about-floating-card span {
      color: var(--muted);
      font-size: 0.72rem;
      line-height: 1.45;
    }

    .about-copy h2,
    .section-heading h2,
    .faq-copy h2,
    .contact-copy h2 {
      margin: 18px 0 23px;
      color: var(--navy);
      font-size: clamp(2.4rem, 4vw, 4.25rem);
      line-height: 1.03;
    }

    .about-copy > p {
      max-width: 570px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.8;
    }

    .about-copy > p + p {
      margin-top: 15px;
    }

    .credential-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 13px;
      margin: 30px 0;
    }

    .credential {
      min-height: 136px;
      padding: 18px 15px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--cream);
    }

    .credential svg {
      width: 22px;
      margin-bottom: 13px;
      color: var(--green);
    }

    .credential strong {
      display: block;
      color: var(--navy);
      font-size: 0.78rem;
      line-height: 1.25;
    }

    .credential small {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.69rem;
      line-height: 1.35;
    }

    /* Marquee */
    .marquee {
      overflow: hidden;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: var(--navy);
      color: var(--mint-strong);
    }

    .marquee-track {
      display: flex;
      width: max-content;
      align-items: center;
      gap: 32px;
      padding: 17px 0;
      animation: marquee 30s linear infinite;
    }

    .marquee-item {
      display: inline-flex;
      align-items: center;
      gap: 32px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .marquee-item::after {
      color: var(--orange);
      content: "✦";
      font-size: 1rem;
    }

    /* Section heading */
    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 40px;
      margin-bottom: 52px;
    }

    .section-heading > p {
      max-width: 390px;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.75;
    }

    /* Services */
    .services {
      background:
        radial-gradient(circle at 92% 22%, rgba(181, 235, 207, 0.4), transparent 22%),
        var(--cream);
    }

    .service-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .service-card {
      position: relative;
      min-height: 290px;
      padding: 25px 23px;
      overflow: hidden;
      border: 1px solid rgba(16, 35, 49, 0.08);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 9px 30px rgba(8, 29, 45, 0.045);
      transition: 0.4s ease;
    }

    .service-card::before {
      position: absolute;
      right: -60px;
      bottom: -80px;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: var(--mint);
      content: "";
      opacity: 0.7;
      transition: transform 0.45s ease;
    }

    .service-card:hover {
      border-color: rgba(30, 154, 104, 0.3);
      box-shadow: var(--shadow-soft);
      transform: translateY(-9px);
    }

    .service-card:hover::before {
      transform: scale(1.35);
    }

    .service-card.featured {
      color: white;
      background: var(--navy);
    }

    .service-card.featured::before {
      background: rgba(77, 181, 233, 0.18);
    }

    .service-card.featured h3,
    .service-card.featured p {
      color: white;
    }

    .service-card.featured p {
      color: rgba(255, 255, 255, 0.7);
    }

    .service-number {
      position: absolute;
      top: 22px;
      right: 22px;
      color: var(--green);
      font-size: 0.7rem;
      font-weight: 800;
    }

    .featured .service-number {
      color: var(--mint-strong);
    }

    .service-icon {
      position: relative;
      z-index: 1;
      display: grid;
      width: 53px;
      height: 53px;
      margin-bottom: 31px;
      place-items: center;
      border-radius: 17px;
      background: var(--mint);
      color: var(--green-dark);
    }

    .featured .service-icon {
      background: rgba(255, 255, 255, 0.12);
      color: var(--mint-strong);
    }

    .service-icon svg {
      width: 25px;
      height: 25px;
    }

    .service-card h3 {
      position: relative;
      z-index: 1;
      max-width: 190px;
      color: var(--navy);
      font-size: 1.12rem;
      line-height: 1.22;
    }

    .service-card p {
      position: relative;
      z-index: 1;
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.62;
    }

    .card-link {
      position: absolute;
      right: 22px;
      bottom: 22px;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--green-dark);
      font-size: 0.75rem;
      font-weight: 800;
    }

    .featured .card-link {
      color: var(--mint-strong);
    }

    .card-link span {
      transition: transform 0.25s ease;
    }

    .card-link:hover span {
      transform: translate(4px, -4px);
    }

    /* Why us */
    .why-us {
      overflow: hidden;
      background: var(--navy);
      color: white;
    }

    .why-us::before {
      position: absolute;
      top: -160px;
      right: -100px;
      width: 430px;
      height: 430px;
      border: 1px solid rgba(158, 229, 188, 0.16);
      border-radius: 50%;
      content: "";
    }

    .why-us::after {
      position: absolute;
      bottom: -200px;
      left: -150px;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: rgba(77, 181, 233, 0.08);
      content: "";
      filter: blur(10px);
    }

    .why-us .section-heading h2 {
      color: white;
    }

    .why-us .section-heading > p {
